services:
  api:
    environment:
      DB_DSN: postgresql://field:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell}@postgres:5432/field
    depends_on:
      postgres: {condition: service_healthy}
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: field
      POSTGRES_DB: field
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell}
    volumes: [postgres:/var/lib/postgresql/data]
    networks: [local]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U field -d field']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres:

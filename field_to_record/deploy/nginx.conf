map $http_upgrade $connection_upgrade { default upgrade; '' close; }
resolver 127.0.0.11 valid=10s ipv6=off;
upstream api { zone api_pool 64k; server api:8000 resolve; keepalive 32; }
upstream speech { zone speech_pool 64k; least_conn; server asr:8000 resolve; keepalive 8; }
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 26m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    location = /healthz { access_log off; return 200 '{"status":"ok"}'; }
    location = /api/live {
        proxy_pass http://speech;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1000s;
        proxy_send_timeout 1000s;
        proxy_buffering off;
    }
    location ~ ^/api/(transcribe|speech/status)$ {
        proxy_pass http://speech;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_read_timeout 120s;
        proxy_request_buffering off;
    }
    location ~ ^/(api/|health$|readyz$|v1/) {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_read_timeout 30s;
    }
    location = /sw.js { add_header Cache-Control no-cache; }
    location /assets/ { add_header Cache-Control 'public, max-age=31536000, immutable'; gzip_static on; }
    location / { try_files $uri $uri/ /index.html; }
    gzip on;
    gzip_types application/javascript text/css application/json image/svg+xml;
}
